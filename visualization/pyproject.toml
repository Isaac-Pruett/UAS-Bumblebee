[project]
name = "visualization"
version = "0.1.0"
description = "visualization - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
 "eclipse-zenoh>=1.9",
 "foxglove-sdk>=0.27.0",
 "msgpack>=1.1.2",
 "msgspec>=0.21.1",
]


# this defines the entrypoint of the python program.
[project.scripts]
visualization = "visualization.main:main"


[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
