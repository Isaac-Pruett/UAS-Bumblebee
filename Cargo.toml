[workspace]
members = [
  "identity",
  "mavlink",
  "demo_ctrl_node",
  "formations",
]

exclude = [ # this is temporary
"splines",
]

resolver = "3"


[workspace.dependencies]
rmp-serde = "1.3.1"
serde = "1.0.229"
tokio = { version = "1.49.0", features = ["full"] }
zenoh = { version = "=1.9.0", features = ["shared-memory"] }
zenoh-ext = "=1.9.0"
glam = {version = "0.33.1", features = ["serde", "zerocopy"]}
