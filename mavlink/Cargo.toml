[package]
name = "mavlink"
version = "0.1.0"
edition = "2024"


[dependencies]
glam = { version = "0.33.0", features = ["serde"] }

mavlink = { version = "0.18.0", default-features = false, features = [
    "std",
    "tokio",
    "transport-direct-serial",
    "transport-tcp",
    "transport-udp",
    "dialect-common"
] }

rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true
zenoh.workspace = true
zenoh-ext.workspace = true

[[bin]]
name = "mavlink"
path = "src/main.rs"
