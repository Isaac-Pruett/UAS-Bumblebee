[package]
name = "mavlink"
version = "0.1.0"
edition = "2024"


[dependencies]
glam = { version = "0.33.0", features = ["serde"] }

mavlink = { version = "0.18.0", default-features = false, features = [
    "std",
    "tokio",
    "transport-direct-serial",
    "transport-tcp",
    "transport-udp",
    "dialect-common"
] }

rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }

tokio = { version = "1.49.0", features = ["full"] }

zenoh = { version = ">=1.9", features = ["shared-memory"] }
zenoh-ext = ">=1.9"

[[bin]]
name = "mavlink"
path = "src/main.rs"
