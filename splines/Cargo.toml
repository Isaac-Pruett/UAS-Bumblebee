[package]
name = "splines"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc = "3.5.2"
flatbuffers = "25.12.19"
glam = {version = "0.33.1", features = ["serde", "zerocopy"]}
rmp-serde = "1.3.1"
serde = "1.0.228"
tokio = { version = "1.49.0", features = ["full"] }

zenoh = {version = ">=1.9", features = ["shared-memory"]}
zenoh-ext = ">=1.9"

[[bin]]
name = "splines"
path = "src/main.rs"
