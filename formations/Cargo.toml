[package]
name = "formations"
version = "0.1.0"
edition = "2024"

default-run = "formations"

[dependencies]
ctrlc = "3.5.2"
flatbuffers = "25.12.19"
glam = {version = "0.33.1", features = ["serde", "zerocopy"]}
rmp-serde = "1.3.1"
serde = "1.0.228"
tokio = { version = "1.49.0", features = ["full"] }

zenoh = {version = ">=1.9", features = ["shared-memory"]}
zenoh-ext = ">=1.9"


serde_json = "1.0.151"
kiss3d = { version = "0.45", optional = true }

[features]
viz = ["dep:kiss3d"]

[[bin]]
name = "formation_viewer"
path = "src/bin/formation_viewer.rs"
required-features = ["viz"]

[[bin]]
name = "formations"
path = "src/main.rs"
