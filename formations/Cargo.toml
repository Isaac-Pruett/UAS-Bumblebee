[package]
name = "formations"
version = "0.1.0"
edition = "2024"
autobins = false

default-run = "formations"

[dependencies]
ctrlc = "3.5.2"


glam.workspace = true
rmp-serde.workspace = true
serde.workspace = true
tokio.workspace = true
zenoh.workspace = true
zenoh-ext.workspace = true

serde_json = "1.0.151"
kiss3d = { version = "0.45", optional = true }
rayon = "1.12.0"
flume = "0.12.0"

[features]
viz = ["dep:kiss3d"]

