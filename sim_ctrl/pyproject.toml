[project]
name = "sim_ctrl"
version = "0.1.0"
description = "sim_ctrl - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
 "eclipse-zenoh>=1.7.1",
 "msgpack>=1.1.2",
 "msgspec>=0.21.1",
 "pynput>=1.8.2",
]


# this defines the entrypoint of the python program.
[project.scripts]
sim_ctrl = "sim_ctrl:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
