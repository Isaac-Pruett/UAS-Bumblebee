[package]
name = "rust_zenoh_template"
version = "0.1.0"
edition = "2024"

[dependencies]

rmp-serde = "1.3.1"
serde = "1.0.229"
tokio = { version = "1.49.0", features = ["full"] }

zenoh = {version = "=1.9.0", features = ["shared-memory"]}
