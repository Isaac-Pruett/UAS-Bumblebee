[project]
name = "python_zenoh_template"
version = "0.1.0"
description = "python_zenoh_template - Python Zenoh Node"
requires-python = ">=3.12"
dependencies = [
 "eclipse-zenoh>=1.9",
 "msgpack>=1.1.2",
 "msgspec>=0.21.1",
]


# this defines the entrypoint of the python program.
[project.scripts]
python_zenoh_template = "python_zenoh_template:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
